<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pro Cycling Results">
  <title>Pro Cycling Results</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00184d" />
      <stop offset="0.6" stop-color="#0033a0" />
      <stop offset="1" stop-color="#0078c7" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#plate)" />
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="15" cy="47" r="9.5" stroke="#ffffff" stroke-width="3.6" />
    <circle cx="49" cy="47" r="9.5" stroke="#ffffff" stroke-width="3.6" />
    <!-- frame: rear hub, bottom bracket, seat tube, down tube to the bars -->
    <path d="M15 47 L32 47 L25 32 M32 47 L43 30 L47 31" stroke="#ffffff" stroke-width="3.2" />
    <!-- legs -->
    <path d="M27 30 L34 38 L33 47" stroke="#ffffff" stroke-width="4.6" />
    <!-- torso, the jersey -->
    <path d="M27 29 L41 20" stroke="#ef3340" stroke-width="8.5" />
    <!-- arm to the bars -->
    <path d="M41 21 L47 30" stroke="#ffffff" stroke-width="4.4" />
  </g>
  <!-- head and helmet -->
  <circle cx="47" cy="14" r="5.6" fill="#ffffff" />
  <path d="M40.6 14.6 A6.6 6.6 0 0 1 53.4 14.6 Z" fill="#ffcc00" />
</svg>
